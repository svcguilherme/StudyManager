[project]
name = "studymanager"
version = "0.1.0"
description = "Kanban de estudos orientado a eventos (Kafka + PostgreSQL)"
requires-python = ">=3.11"
dependencies = [
    "confluent-kafka>=2.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13",
    "tzdata",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
study = "studymanager.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["studymanager*"]

[tool.setuptools.package-data]
studymanager = ["templates/*.html"]
