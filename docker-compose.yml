services:
  # Redpanda: broker compatível com a API do Kafka, mais leve para rodar local.
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    container_name: study-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --smp=1
      - --memory=1G
      - --mode=dev-container
      - --overprovisioned
    ports:
      - "19092:19092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data

  # Interface web para ver tópicos, mensagens e consumer groups: http://localhost:8080
  console:
    image: docker.redpanda.com/redpandadata/console:v2.7.2
    container_name: study-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:9092
    ports:
      - "8080:8080"
    depends_on:
      - redpanda

  postgres:
    image: postgres:16
    container_name: study-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: studymanager
    ports:
      - "5433:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data

volumes:
  redpanda-data:
  pg-data:
